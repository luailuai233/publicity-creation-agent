[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "publicity-creation-workbench"
version = "0.1.0"
requires-python = ">=3.9"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --basetemp=.runtime/pytest-tmp -p no:cacheprovider"

[tool.setuptools.packages.find]
include = ["workbench*"]
