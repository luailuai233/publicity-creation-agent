<section class="journal-paper">
  <div class="editor-tabs" role="tablist"><button role="tab">标题</button><button role="tab">大纲</button><button role="tab" aria-selected="true">正文</button></div>
  {% if draft %}
    <input class="draft-title" value="{{ draft.title }}" aria-label="稿件标题">
    <textarea data-editor data-draft-id="{{ draft.id }}" aria-label="正文编辑器">{{ draft.content }}</textarea>
  {% else %}
    <div class="empty-state"><h2>Agent 尚未交付稿件</h2><p>返回 Agent 工作台启动或恢复自主创作；无需手动确认标题和大纲。</p><a class="system-button secondary-action" href="/project/{{ project.id }}/agent">返回 Agent</a></div>
  {% endif %}
</section>
