<section class="export-preview"><h2>正文预览</h2>{% if draft %}<h3>{{ draft.title }}</h3><pre>{{ draft.content }}</pre><div class="export-options"><label>格式 <select name="format"><option value="markdown">Markdown</option><option value="plain_text">纯文本</option></select></label><label><input type="checkbox" name="include_notes">附带创作说明和待确认清单</label></div>{% else %}<div class="empty-state">暂无稿件。</div>{% endif %}</section>
