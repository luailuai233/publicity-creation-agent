<div id="recent-projects" class="recent-projects" aria-live="polite">
  {% if projects %}
    {% for project in projects %}
      <article class="project-card" id="project-{{ project.id }}">
        <div>
          <span class="project-status">{{ project.status }}</span>
          <h3>{{ project.name }}</h3>
          <p>{{ project.audience }} · {{ project.length_min }}–{{ project.length_max }} 字</p>
        </div>
        <div class="project-actions">
          <a class="system-button secondary-action" href="/project/{{ project.id }}/agent">进入 Agent</a>
          <button class="text-button" type="button" hx-delete="/projects/{{ project.id }}" hx-target="#project-{{ project.id }}" hx-swap="outerHTML" hx-confirm="删除后项目素材也会一并清理，确定继续吗？">删除</button>
        </div>
      </article>
    {% endfor %}
  {% else %}
    <div class="empty-state">
      <span class="empty-pixel" aria-hidden="true">▧</span>
      <p>桌面还是空的，创建第一个宣传任务吧。</p>
    </div>
  {% endif %}
</div>
