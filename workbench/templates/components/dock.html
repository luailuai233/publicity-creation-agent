<nav class="desktop-dock" aria-label="创作步骤">
  {% if navigation %}
  {% for item in navigation.items %}
    <a class="dock-item{% if item.is_active %} is-active{% endif %}{% if item.prerequisite %} has-prerequisite{% endif %}" href="{{ item.href }}" title="{{ item.prerequisite or item.status }}">
      <span class="dock-icon" aria-hidden="true">{{ item.icon }}</span><span>{{ item.label }}</span><small>{{ item.status }}</small>
      {% if item.status in ['待确认','待处理'] %}<span class="dock-alert" aria-label="存在异常">!</span>{% elif item.status == '已完成' %}<span class="dock-complete" aria-label="已完成">✓</span>{% endif %}
    </a>
  {% endfor %}
  {% else %}
    <a class="dock-item is-active" href="/"><span class="dock-icon" aria-hidden="true">⌂</span><span>我的桌面</span></a>
  {% endif %}
</nav>
