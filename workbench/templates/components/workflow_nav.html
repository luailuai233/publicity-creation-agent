<nav class="workflow-navigation" aria-label="项目工作流">
  {% for item in navigation.items %}
  <a class="workflow-item{% if item.is_active %} is-active{% endif %}{% if item.prerequisite %} has-prerequisite{% endif %}" href="{{ item.href }}" title="{{ item.prerequisite or item.status }}">
    <span class="workflow-icon" aria-hidden="true">{{ item.icon }}</span>
    <span>{{ item.label }}</span>
    <small>{{ item.status }}</small>
    {% if item.status in ['待确认','待处理'] %}<b class="workflow-alert" aria-label="存在异常">!</b>{% elif item.status == '已完成' %}<b class="workflow-complete" aria-label="已完成">✓</b>{% endif %}
  </a>
  {% endfor %}
</nav>
